name: GLSI update

# Ciclo autosufficiente: ogni esecuzione fa 4 giri a un'ora di distanza e alla fine
# rilancia se stessa (workflow_dispatch). L'orario programmato di GitHub, che spesso
# salta, e i push (es. il commento del mattino) servono solo come riavvio di riserva.
on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
      - "assets/**"
      - "data/commentary.json"
      - ".github/workflows/**"

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: glsi-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet pandas numpy requests matplotlib

      - name: Giri orari (4)
        id: loop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: https://onlywave.github.io/global-liquidity-radar/
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          git config user.name "glsi-bot"
          git config user.email "glsi-bot@users.noreply.github.com"
          ok=0
          for i in 1 2 3 4; do
            echo "=== giro $i $(date -u +%H:%MZ) ==="
            if bash scripts/run_once.sh; then ok=$((ok+1)); fi
            [ "$i" -lt 4 ] && sleep 3300
          done
          echo "giri riusciti: $ok/4"
          [ "$ok" -gt 0 ]

      - name: Rilancio del ciclo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # se i giri sono falliti, attende 30 minuti per non creare un ciclo rapido di errori
          if [ "${{ steps.loop.outcome }}" != "success" ]; then sleep 1800; fi
          curl -s -o /dev/null -w "dispatch HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update.yml/dispatches" \
            -d '{"ref":"main"}'
