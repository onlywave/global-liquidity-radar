name: GLSI update

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write
  issues: write

concurrency:
  group: glsi-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet pandas numpy requests matplotlib

      - name: Build GLSI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: https://onlywave.github.io/global-liquidity-radar/
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          python scripts/build.py
          python scripts/static.py

      - name: Commit data
        run: |
          git config user.name "glsi-bot"
          git config user.email "glsi-bot@users.noreply.github.com"
          git add data/ index.html
          if git diff --cached --quiet; then echo "nessun cambiamento"; exit 0; fi
          git commit -m "data: aggiornamento $(date -u +%Y-%m-%dT%H:%MZ)" --quiet
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push --quiet origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
