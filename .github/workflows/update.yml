name: GLSI update

on:
  schedule:
    # ogni ora al minuto 23: GitHub salta a volte le esecuzioni programmate,
    # un orario fitto garantisce più giri utili al giorno
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
      - "assets/**"
      - "data/commentary.json"
      - ".github/workflows/**"

permissions:
  contents: write
  issues: write

concurrency:
  group: glsi-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet pandas numpy requests matplotlib

      - name: Build GLSI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: https://onlywave.github.io/global-liquidity-radar/
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          python scripts/build.py
          python scripts/static.py

      - name: Commit data (solo se cambiati)
        run: |
          git config user.name "glsi-bot"
          git config user.email "glsi-bot@users.noreply.github.com"
          if ! python scripts/changed.py; then
            echo "Dati invariati: nessun commit"
            exit 0
          fi
          git add data/ index.html
          git commit -m "data: aggiornamento $(date -u +%Y-%m-%dT%H:%MZ)" --quiet
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push --quiet origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
